name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure, build and test with MSVC x64
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ x64 toolchain was not found.' }
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:CC = 'cl.exe'
          $env:CXX = 'cl.exe'
          cmake --preset canary-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset canary-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset canary-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record candidate hashes
        shell: pwsh
        run: |
          Get-FileHash build-canary-5.2.0/Sonalis.exe -Algorithm SHA256
          Get-FileHash build-canary-5.2.0/SonalisGuardianScanner.exe -Algorithm SHA256

      - name: Upload unsigned review candidate
        uses: actions/upload-artifact@v7
        with:
          name: Sonalis-5.2.0-Windows-unsigned-review
          if-no-files-found: error
          retention-days: 7
          path: |
            build-canary-5.2.0/Sonalis.exe
            build-canary-5.2.0/SonalisGuardianScanner.exe

