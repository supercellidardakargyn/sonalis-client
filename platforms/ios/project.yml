name: SonalisIOS
options:
  bundleIdPrefix: tr.sonalis
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    ENABLE_BITCODE: NO
targets:
  SonalisIOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../apple-shared
      - path: ../ios
        includes:
          - SonalisVoiceSession.swift
          - SonalisKeychainStore.swift
          - SonalisCoreBridge.h
      - path: ../../core/src
        includes:
          - c_api.cpp
          - c_voice_codec.cpp
          - client_state.cpp
          - event_generation.cpp
          - portable_crypto.cpp
          - voice_codec.cpp
          - voice_session.cpp
      - path: ../../core/include
        buildPhase: none
      - path: ../../core/vendor/monocypher/src/monocypher.c
      - path: ../../core/vendor/monocypher/src/optional/monocypher-ed25519.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tr.sonalis.mobile
        PRODUCT_NAME: Sonalis
        MARKETING_VERSION: 5.2.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: SonalisCoreBridge.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../../core/include $(SRCROOT)/../../core/vendor/monocypher/src $(SRCROOT)/../../core/vendor/monocypher/src/optional $(SRCROOT)/../../core/vendor/opus/include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../core/vendor/opus/build-ios-sim/Release"
        OTHER_LDFLAGS: "-lopus"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: UserNotifications.framework
      - sdk: Network.framework
      - sdk: CryptoKit.framework
schemes:
  SonalisIOS:
    build:
      targets:
        SonalisIOS: all
    run:
      config: Debug
    archive:
      config: Release
